global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: triton
    metrics_path: /metrics
    static_configs:
      - targets:
          - triton:8002

  - job_name: dcgm-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - dcgm-exporter:9400
