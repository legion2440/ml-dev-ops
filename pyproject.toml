[project]
name = "ml-dev-ops"
version = "0.1.0"
description = "Production-style computer vision serving with NVIDIA Triton"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.23,<5",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
