schema_version: 1
repository_license: AGPL-3.0-only
requirements_lock: scripts/model_preparation/requirements.lock

build:
  exporter_image: docker.io/ultralytics/ultralytics:8.3.0-cpu@sha256:e666f09be0c147448c83dae39308f552e77ac526096bca8755e52af611991619
  exporter_local_image: ml-dev-ops/model-exporter:step3
  tensorrt_builder_image: nvcr.io/nvidia/tensorrt:26.07-py3@sha256:715352ed6840166888d79b135dd2a8d3f23ffe3169b8cacb6ca4df270388a8df
  onnx_opset: 17
  simplify: false
  target:
    gpu_name: NVIDIA GeForce RTX 4080 Laptop GPU
    compute_capability: "8.9"

models:
  resnet50:
    source:
      framework: torchvision
      identifier: ResNet50_Weights.IMAGENET1K_V2
      url: https://download.pytorch.org/models/resnet50-11ad3fa6.pth
      filename: resnet50-11ad3fa6.pth
      hash_status: resolved
      sha256: 11ad3fa62ca79e40addfd354a8ec4b7c75143b3038b8d2a807fbc68deab379ca
      code_license: BSD-3-Clause
      weights_terms: ImageNet-derived; upstream dataset and weight terms require independent review
    preprocessing:
      resize: 232
      center_crop: 224
      scale: [0.0, 1.0]
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    input:
      name: images
      dtype: FP32
      shape: [-1, 3, 224, 224]
    output:
      name: logits
      dtype: FP32
      shape: [-1, 1000]
    export:
      dynamic_axes:
        images: [batch]
        logits: [batch]
      nms: false
    labels:
      source_url: https://raw.githubusercontent.com/pytorch/hub/master/imagenet_classes.txt
      source_sha256: 1f386e0d1cb6e28b9c2dac651c3dea6801e98ad1b41a14ce6bb1a093d72069f5
      generated_sha256: e697a491aa735cc6c2aaf982f8e86e8fc7b0a1ea7750a2cc6a2bdfc1e109012f
      filename: imagenet1k.txt
      count: 1000
    serving:
      onnx:
        name: resnet50_onnx
        artifact_path: models/resnet50_onnx/1/model.onnx
        config_path: models/resnet50_onnx/config.pbtxt
        precision: FP32
        max_batch_size: 8
      tensorrt:
        name: resnet50_tensorrt
        artifact_path: models/resnet50_tensorrt/1/model_cc89.plan
        config_path: models/resnet50_tensorrt/config.pbtxt
        precision: FP16
        compute_precision: FP16
        io_precision: FP32
        max_batch_size: 8
        profile:
          min: [1, 3, 224, 224]
          opt: [4, 3, 224, 224]
          max: [8, 3, 224, 224]
    smoke_batches: [1, 4, 8]
    parity:
      max_abs_error: 0.5
      mean_abs_error: 0.05
      minimum_cosine_similarity: 0.999
      minimum_top1_agreement: 1.0

  yolo11n:
    source:
      framework: ultralytics
      identifier: yolo11n.pt
      url: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.pt
      filename: yolo11n.pt
      hash_status: resolved
      sha256: 0ebbc80d4a7680d14987a577cd21342b65ecfd94632bd9a8da63ae6417644ee1
      code_license: AGPL-3.0
      weights_license: AGPL-3.0
    preprocessing:
      resize: [640, 640]
      scale: [0.0, 1.0]
      channel_order: RGB
    input:
      name: images
      dtype: FP32
      shape: [-1, 3, 640, 640]
    output:
      name: output0
      dtype: FP32
      shape: [-1, 84, 8400]
    export:
      dynamic_axes:
        images: [batch]
        output0: [batch]
      nms: false
    labels:
      source_url: https://raw.githubusercontent.com/ultralytics/ultralytics/v8.3.0/ultralytics/cfg/datasets/coco.yaml
      source_sha256: bd6f98a2e18775c39a4d5214080c87fcb163d367c18a2fcf2609371bab00c0b8
      generated_sha256: bd17f1ee35d5f3c862a4894605855abbb9dda4b0621fdb0ac4c2c8c7bb7e730a
      filename: coco80.txt
      count: 80
      extraction: names
    serving:
      onnx:
        name: yolo11n_onnx
        artifact_path: models/yolo11n_onnx/1/model.onnx
        config_path: models/yolo11n_onnx/config.pbtxt
        precision: FP32
        max_batch_size: 2
    smoke_batches: [1, 2]
